<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)"/>
  <!-- Printer / POS body -->
  <rect x="96" y="140" width="320" height="220" rx="36" fill="#ffffff" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.15))"/>
  <!-- Receipt slip -->
  <path d="M140 80 H372 V140 H140 Z" fill="#f1f5f9"/>
  <rect x="170" y="100" width="172" height="8" rx="4" fill="#94a3b8"/>
  <!-- Feed slot -->
  <rect x="130" y="140" width="252" height="14" rx="7" fill="#0f172a"/>
  <!-- Paper lines -->
  <rect x="140" y="180" width="140" height="12" rx="6" fill="#3b82f6"/>
  <rect x="140" y="206" width="200" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="140" y="226" width="160" height="10" rx="5" fill="#cbd5e1"/>
  <!-- Thermal status LED & buttons -->
  <circle cx="340" cy="300" r="14" fill="url(#emeraldGrad)"/>
  <rect x="140" y="284" width="80" height="32" rx="10" fill="#2563eb"/>
  <text x="180" y="305" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">POS</text>
</svg>
